<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Primary Meta Tags -->
    <title>NextSignal — AI-Powered Geohazard & Early Warning System</title>
    <meta name="title" content="NextSignal — AI-Powered Geohazard & Early Warning System" />

    <meta name="author" content="NextSignal Team" />
    <link rel="icon" type="image/jpeg" href="/favico/nextsignal-icon.jpg" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: #090d16;
        color: #f8fafc;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        background: #090d16;
      }

      /* Natural Dark Tactical Map Styling Matching Reference Image */
      .leaflet-container {
        background: #090d16 !important;
      }
      
      .leaflet-tile {
        image-rendering: -webkit-optimize-contrast;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, sans-serif; background: #090d16;">
        <img src="/nextsignal-logo.jpg" style="width: 48px; height: 48px; border-radius: 8px; margin-bottom: 14px; box-shadow: 0 0 20px rgba(56,189,248,0.5);" alt="NextSignal" />
        <div style="font-size: 18px; font-weight: 900; color: #f8fafc; margin-bottom: 6px; letter-spacing: 1px;">NEXTSIGNAL</div>
        <div style="font-size: 12px; color: #38bdf8;">Initializing Geohazard & Early Warning Intelligence Console...</div>
      </div>
    </div>

    <!-- Application Entry Point -->
    <script type="module" src="/src/main.ts"></script>
